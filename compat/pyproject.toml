[project]
name = "openxet-compat"
version = "0.0.0"
description = "Real-client compatibility suite for openxet"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub==2.2.0",
    "hf_xet==1.7.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The storage-only leg writes hundreds of MB per run; keep only what a
# failure needs for debugging.
tmp_path_retention_policy = "failed"
markers = [
    "agent: drives the openxet CLI as an agent would (needs OPENXET_BIN)",
    "docs: runs the documentation's examples against the built CLI (needs OPENXET_BIN)",
    "git: stock git over smart HTTP against openxet serve (needs OPENXET_BIN)",
    "hub: stock huggingface_hub and hf against openxet serve (needs OPENXET_BIN)",
    "lfs: git-lfs and git-xet with repos on Gitea, and jj-xet's contract (needs OPENXET_BIN; the Gitea tests need compat/gitea)",
    "pinned: only valid when the locked client versions are installed",
    "storage_only: stock hf_xet against openxet serve, no Hub (needs OPENXET_BIN)",
]

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
]
