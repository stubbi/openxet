allow-unwrap-in-tests = true
allow-expect-in-tests = true
doc-valid-idents = ["SQLite", ".."]
# CAS routes go through `openxet_cas`'s `routes::Routes`, which lists every
# route it serves, so the tests can check each one is authenticated.
disallowed-methods = [
  { path = "axum::Router::route", reason = "add CAS routes through routes::Routes so endpoints() lists them" },
  { path = "axum::Router::route_service", reason = "add CAS routes through routes::Routes so endpoints() lists them" },
  { path = "axum::Router::nest", reason = "add CAS routes through routes::Routes so endpoints() lists them" },
  { path = "axum::Router::nest_service", reason = "add CAS routes through routes::Routes so endpoints() lists them" },
  { path = "axum::Router::merge", reason = "add CAS routes through routes::Routes so endpoints() lists them" },
]
