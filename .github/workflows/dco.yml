name: dco

on:
  pull_request:

permissions: {}

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Dependabot cannot sign off, so it is the only exempt author.
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
