name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly advisory check, so a new RustSec advisory surfaces without a PR.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  waitlist:
    name: hosted waitlist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      # Uses only Node built-ins and the checked-in SQLite migrations.
      - run: npm test --prefix hosted/waitlist

  # The brand is written OpenXet wherever text names the project, and
  # lowercase openxet only as an identifier (AGENTS.md, Brand). Public copy
  # has no em or en dashes and no stock AI phrasing (design.md, Voice).
  brand:
    name: brand
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Brand check script tests
        run: python3 -I scripts/test_check_brand.py
      - name: The brand is written OpenXet
        run: python3 -I scripts/check-brand.py
      - name: Copy check script tests
        run: python3 -I scripts/test_check_copy.py
      - name: No em or en dashes, no stock phrasing
        run: python3 -I scripts/check-copy.py

  rust:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the exact channel and components from rust-toolchain.toml, so
      # the pin lives in one place.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Reference files for the golden tests; the script verifies checksums
      # whether or not the cache hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            testdata/xet-spec-reference/*
            !testdata/xet-spec-reference/SHA256SUMS
          key: xet-spec-reference-${{ hashFiles('testdata/xet-spec-reference/SHA256SUMS') }}
      - run: scripts/fetch-reference-files.sh
      - run: cargo nextest run --locked --workspace
      # Ruling M2-R15: the checked-in OpenAPI document is what the routes
      # generate.
      - run: scripts/check-openapi.sh
      # Every Rust test docs/reference/security-tests.md maps runs, once.
      - name: Security test map matches the tests that run
        run: |
          cargo nextest list --locked --workspace --message-format json > "$RUNNER_TEMP/tests.json"
          python3 -I scripts/check-security-tests-map.py --nextest "$RUNNER_TEMP/tests.json"
      - name: Latency gate comparison script tests
        run: python3 -I scripts/test_check_latency_gate.py
      # Release builds drop upstream's debug self-check of MerkleHashSubtree,
      # so the incremental file hash is also tested the way production runs it.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --release -p openxet-protocol -E 'binary(file_hash_streaming)'
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Design §5.8: reconstruction p99 < 50 ms for files up to 100k terms,
      # and token, resolve and tree p99 < 10 ms at 10,000 repositories and a
      # 10,000-file repository, in release builds as production runs, on the
      # Linux runner servers resemble (the 3-vCPU macOS VM's timings are
      # recorded in docs/reference/benchmarks.md). The CPU model comes first,
      # since the runner comes as machine types of different speed.
      #
      # Ruling M2-R17 (issue #83): a loaded runner can miss the bar with
      # nothing changed, so on a pull request each latency gate compares the
      # PR with its base, the base branch's tip recorded in the event
      # (pull_request.base.sha), both measured here on this runner.
      # scripts/check-latency-gate.py holds the absolute bar whenever the
      # base meets it. On main the gates assert their bars on the pushed
      # commit alone; the release rig (issue #55) enforces them
      # unconditionally.
      - if: matrix.os == 'ubuntu-latest'
        run: grep -m1 'model name' /proc/cpuinfo
      - name: Latency gates (absolute)
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: |
          cargo nextest run --locked --release -p openxet-cas -E 'binary(latency_gate)' --no-capture
          cargo nextest run --locked --release -p openxet-hub -E 'binary(hub_latency_gate)' --no-capture
      - name: Check out the base for the latency gate
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: latency-gate-base
          persist-credentials: false
      # Both runs use HEAD's measurement code (each gate test and its
      # fixture), so only the measured library comes from the base and a
      # base from before M2-R17 still prints JSON lines. `--test` builds
      # that one binary, so the base's other tests never meet HEAD's
      # fixture. The base builds in its own target directory: in a shared
      # one cargo's fingerprints for the workspace crates match across the
      # two checkouts and the head step would rerun the base's build.
      # rust-cache treats target/latency-base as a nested target directory,
      # so it caches its dependencies and drops its workspace crates.
      # OPENXET_LATENCY_GATE_BUILD is read when the test compiles, and the
      # check rejects two runs that report the same commit. If the base can't build
      # HEAD's test (an API it lacks) or the run fails, the job goes on:
      # the summary says so, and the check holds the shapes the base didn't
      # measure to the absolute bar.
      - name: Latency gates on the base
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        working-directory: latency-gate-base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/latency-base
          OPENXET_LATENCY_GATE: measure
        run: |
          set -o pipefail
          status=0
          OPENXET_LATENCY_GATE_BUILD="$(git rev-parse HEAD)"
          export OPENXET_LATENCY_GATE_BUILD
          cp "$GITHUB_WORKSPACE/crates/cas/tests/latency_gate.rs" crates/cas/tests/latency_gate.rs
          mkdir -p crates/cas/tests/fixture
          cp "$GITHUB_WORKSPACE/crates/cas/tests/fixture/large_files.rs" crates/cas/tests/fixture/large_files.rs
          mkdir -p crates/hub/tests/fixture
          cp "$GITHUB_WORKSPACE/crates/hub/tests/hub_latency_gate.rs" crates/hub/tests/hub_latency_gate.rs
          cp "$GITHUB_WORKSPACE/crates/hub/tests/fixture/metadata.rs" crates/hub/tests/fixture/metadata.rs
          { rustup toolchain install && cargo nextest run --locked --release -p openxet-cas --test latency_gate -E 'binary(latency_gate)' --no-capture; } 2>&1 | tee "$RUNNER_TEMP/latency-base.log" || status=$?
          grep -F '"schema":"openxet.latency-gate.v1"' "$RUNNER_TEMP/latency-base.log" > "$RUNNER_TEMP/latency-base.json" || true
          if [ "$status" -ne 0 ]; then
            echo "The base's reconstruction latency gate, built with this PR's measurement code, failed to build or run (exit $status), so shapes it didn't measure are held to the absolute 50 ms bar." >> "$GITHUB_STEP_SUMMARY"
          fi
          status=0
          cargo nextest run --locked --release -p openxet-hub --test hub_latency_gate -E 'binary(hub_latency_gate)' --no-capture 2>&1 | tee "$RUNNER_TEMP/hub-latency-base.log" || status=$?
          grep -F '"schema":"openxet.latency-gate.v1"' "$RUNNER_TEMP/hub-latency-base.log" > "$RUNNER_TEMP/hub-latency-base.json" || true
          if [ "$status" -ne 0 ]; then
            echo "The base's Hub metadata latency gate, built with this PR's measurement code, failed to build or run (exit $status), so shapes it didn't measure are held to the absolute 10 ms bar." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Latency gates on the pull request
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        env:
          OPENXET_LATENCY_GATE: measure
        run: |
          set -o pipefail
          OPENXET_LATENCY_GATE_BUILD="$(git rev-parse HEAD)"
          export OPENXET_LATENCY_GATE_BUILD
          cargo nextest run --locked --release -p openxet-cas -E 'binary(latency_gate)' --no-capture | tee "$RUNNER_TEMP/latency-head.log"
          grep -F '"schema":"openxet.latency-gate.v1"' "$RUNNER_TEMP/latency-head.log" > "$RUNNER_TEMP/latency-head.json"
          cargo nextest run --locked --release -p openxet-hub -E 'binary(hub_latency_gate)' --no-capture | tee "$RUNNER_TEMP/hub-latency-head.log"
          grep -F '"schema":"openxet.latency-gate.v1"' "$RUNNER_TEMP/hub-latency-head.log" > "$RUNNER_TEMP/hub-latency-head.json"
      - name: Latency gate compared with the base
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        # GITHUB_SHA is the merge commit checked out above.
        run: python3 -I scripts/check-latency-gate.py --base "$RUNNER_TEMP/latency-base.json" --head "$RUNNER_TEMP/latency-head.json" --head-build "$GITHUB_SHA"
      # Runs whether or not the reconstruction comparison passed, so a PR
      # sees both verdicts.
      - name: Hub latency gate compared with the base
        if: "!cancelled() && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'"
        run: python3 -I scripts/check-latency-gate.py --base "$RUNNER_TEMP/hub-latency-base.json" --head "$RUNNER_TEMP/hub-latency-head.json" --head-build "$GITHUB_SHA" --p99-limit-ms 10 --title "Hub metadata latency gate"
      # Serving a clone of the 10k-commit repository costs at most 2x git's
      # own CPU, both measured in this run, so the bar is this runner's own;
      # and git.thin_bases' defaults place the deepest thin base of that
      # repository (docs/reference/benchmarks.md, "Git").
      - name: Fetch gate and thin-base budget
        if: "!cancelled() && matrix.os == 'ubuntu-latest'"
        run: cargo nextest run --locked --release -p openxet-git -E 'binary(fetch_gate) | binary(thin_bases_budget)' --no-capture

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # ADR 0006: the ban on the client core outside openxet-client must
      # reject a scratch dependency from a server crate.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.19.9
      - run: scripts/check-client-core-ban.sh

  advisories:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories

  compat:
    name: compat (agent leg)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - name: Tracked files carry no secrets
        run: uv run --frozen --directory compat pytest tests/test_fixture_redaction.py
      - name: Security test map matches the compat tests that run
        run: |
          uv run --frozen --directory compat pytest --collect-only -q > "$RUNNER_TEMP/compat-tests.txt"
          python3 -I scripts/check-security-tests-map.py --pytest "$RUNNER_TEMP/compat-tests.txt"
      # Needs no network: checks the harness isolates client env and caches.
      - name: Harness isolation
        run: uv run --frozen --directory compat pytest tests/test_harness.py -m "not pinned"
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m agent
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # Stock hf_xet (the pinned floor) against openxet serve, with no Hub.
  compat-storage-only:
    name: compat (storage-only)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m storage_only
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet
      # docs/quickstart-storage-only.md runs as written, install block
      # excepted, and steps 2 to 5 fail past 2 minutes. The end-to-end time
      # to first upload (design §5.8) is measured per release.
      - run: uv run --frozen --directory compat pytest -m docs
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # Stock huggingface_hub and hf (the pinned versions) against openxet
  # serve's Hub API, as alice and bob of compat/hub_harness.py's rules.
  compat-hub:
    name: compat (hub)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m hub
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # The runner's git over smart HTTP, against one node and against two
  # nodes sharing a data directory.
  compat-git:
    name: compat (git)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - run: git --version
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m git
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # ADR 0003's leg: repos on Gitea (compat/gitea/compose.yaml, pinned by
  # digest), LFS objects on openxet, git-lfs 3.7.1 and git-xet 0.2.1 as
  # spike S7 observed them; and jj-xet's contract.
  compat-lfs:
    name: compat (lfs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      # Release binaries, checked against the SHA-256 each release
      # publishes (git-lfs's sha256sums.asc, the git-xet release's asset
      # digests); ahead of the runner's own git-lfs on PATH.
      - name: Install git-lfs 3.7.1 and git-xet 0.2.1
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lfs-clients"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
          echo "1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08  git-lfs-linux-amd64-v3.7.1.tar.gz" | sha256sum -c -
          tar -xzf git-lfs-linux-amd64-v3.7.1.tar.gz
          install -m 0755 git-lfs-3.7.1/git-lfs "$bin/git-lfs"
          curl -fsSLO --retry 3 https://github.com/huggingface/xet-core/releases/download/git-xet-v0.2.1/git-xet-linux-x86_64.zip
          echo "e6354d55704cc838d1feed79ee27b9b89da7752ae98bd83df5797c180700fdb1  git-xet-linux-x86_64.zip" | sha256sum -c -
          unzip -q git-xet-linux-x86_64.zip -d git-xet
          install -m 0755 git-xet/git-xet "$bin/git-xet"
          echo "$bin" >> "$GITHUB_PATH"
      - run: git lfs version && git-xet --version
      # The password protects a throwaway container on 127.0.0.1; it is
      # masked in the log all the same.
      - name: Start Gitea and seed its user
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          OPENXET_COMPAT_GITEA_PASSWORD="$password" compat/gitea/seed.sh > /dev/null
          {
            echo "OPENXET_COMPAT_GITEA_URL=http://127.0.0.1:3000"
            echo "OPENXET_COMPAT_GITEA_USER=compat"
            echo "OPENXET_COMPAT_GITEA_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m lfs
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet
      - name: Gitea's log
        if: failure()
        run: docker compose -f compat/gitea/compose.yaml logs

  # The Git role's protocol tests against git 2.37.7, the oldest git it
  # supports (ADR 0004 item 8), besides the runner's own.
  git-floor:
    name: git floor (2.37.7)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - id: git-floor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openxet/git-2.37.7
          key: git-2.37.7-${{ runner.os }}-${{ hashFiles('scripts/install-git-floor.sh') }}
      - if: steps.git-floor-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libexpat1-dev zlib1g-dev
      - run: scripts/install-git-floor.sh "$HOME/.cache/openxet/git-2.37.7"
      - run: OPENXET_TEST_GIT_237="$HOME/.cache/openxet/git-2.37.7/bin/git" cargo nextest run --locked -p openxet-git

  # Not a required check: it needs the nightly toolchain, whose moving
  # sanitizer and coverage flags make it non-hermetic (see GOVERNANCE.md).
  fuzz-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The fuzzed crates, their dependency versions (fuzz/seed.sh derives
      # the fuzz lockfile from Cargo.lock), or the targets themselves.
      - name: Parser or fuzz targets changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(crates/(protocol|auth|cas|index|storage|uri|git|hub)/|fuzz/|Cargo\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to a fuzzed crate (protocol, auth, cas, index, storage, uri, git, hub), fuzz/ or Cargo.lock; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install nightly --profile minimal
      - if: steps.changed.outputs.run == 'true'
        run: scripts/fetch-reference-files.sh
      # Also rewrites fuzz/Cargo.lock from Cargo.lock, so it runs before the
      # cache keys on that lockfile. The committed one must match: cargo-fuzz
      # has no --locked, so this is what keeps the fuzz build locked.
      - if: steps.changed.outputs.run == 'true'
        run: fuzz/seed.sh
      - if: steps.changed.outputs.run == 'true'
        name: fuzz/Cargo.lock matches Cargo.lock
        run: |
          git diff --exit-code fuzz/Cargo.lock || {
            echo "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock is out of step with Cargo.lock; run fuzz/seed.sh and commit fuzz/Cargo.lock"
            exit 1
          }
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz@0.13.2
      # fuzz/ is its own workspace, so the deny job doesn't see what only
      # fuzzing adds.
      - if: steps.changed.outputs.run == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which can't link the sanitizer runtime.
      - if: steps.changed.outputs.run == 'true'
        run: |
          for target in xorb_upload xorb_chunks upload_shard verify_shard \
            cas_token transfer_url reconstruction_range xet_uri pkt_line \
            receive_request hook_request commit_ndjson; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  # Builds the docs site as pages.yml deploys it, which fails on an mdBook
  # warning, a page under docs/ missing from docs/SUMMARY.md, or a repository
  # link to a missing file; then checks every link and anchor in the built
  # site and in docs/, offline. Not a required check yet.
  docs-site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook@0.5.4
      - run: scripts/build-site.sh
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --index-files index.html,. --no-progress
            --root-dir ${{ github.workspace }}/target/site/public
            --exclude-path docs/SUMMARY.md
            target/site/public docs
          jobSummary: false
