name: ci

# Scratch branch diag/workspace-speed only: the workspaces gate's speed
# diagnosis. Never merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  workspaces-speed-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - name: Mount a 20 GiB XFS volume with reflink
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs inotify-tools
          image="$RUNNER_TEMP/workspaces.img"
          volume="$RUNNER_TEMP/workspaces-volume"
          truncate -s 20G "$image"
          mkfs.xfs -q -m reflink=1 "$image"
          mkdir -p "$volume"
          sudo mount -o loop "$image" "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          echo "OPENXET_COMPAT_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
      - run: cargo build --locked -p openxet
      - run: nproc && uname -r && cat /proc/cpuinfo | grep "model name" | head -1
      - run: uv run --frozen --directory compat python speed_diag.py "$GITHUB_WORKSPACE" "$OPENXET_COMPAT_WORKSPACE_VOLUME" 4
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet
