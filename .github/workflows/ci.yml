name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly advisory check, so a new RustSec advisory surfaces without a PR.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  waitlist:
    name: hosted waitlist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      # Uses only Node built-ins and the checked-in SQLite migrations.
      - run: npm test --prefix hosted/waitlist

  rust:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the exact channel and components from rust-toolchain.toml, so
      # the pin lives in one place.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Reference files for the golden tests; the script verifies checksums
      # whether or not the cache hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            testdata/xet-spec-reference/*
            !testdata/xet-spec-reference/SHA256SUMS
          key: xet-spec-reference-${{ hashFiles('testdata/xet-spec-reference/SHA256SUMS') }}
      - run: scripts/fetch-reference-files.sh
      - run: cargo nextest run --locked --workspace
      # Every Rust test docs/reference/security-tests.md maps runs, once.
      - name: Security test map matches the tests that run
        run: |
          cargo nextest list --locked --workspace --message-format json > "$RUNNER_TEMP/tests.json"
          python3 -I scripts/check-security-tests-map.py --nextest "$RUNNER_TEMP/tests.json"
      # Release builds drop upstream's debug self-check of MerkleHashSubtree,
      # so the incremental file hash is also tested the way production runs it.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --locked --release -p openxet-protocol -E 'binary(file_hash_streaming)'
      # Design §5.8: reconstruction p99 < 50 ms for files up to 100k terms,
      # in a release build as production runs, on the Linux runner servers
      # resemble (the 3-vCPU macOS VM's timings are recorded in
      # docs/reference/benchmarks.md). It prints each shape's p50 and p99,
      # so the log tracks the margin, after the CPU model, since the runner
      # comes as machine types of different speed.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          grep -m1 'model name' /proc/cpuinfo
          cargo nextest run --locked --release -p openxet-cas -E 'binary(latency_gate)' --no-capture
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # ADR 0006: the ban on the client core outside openxet-client must
      # reject a scratch dependency from a server crate.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.19.9
      - run: scripts/check-client-core-ban.sh

  advisories:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories

  compat:
    name: compat (agent leg)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - name: Tracked files carry no secrets
        run: uv run --frozen --directory compat pytest tests/test_fixture_redaction.py
      - name: Security test map matches the compat tests that run
        run: |
          uv run --frozen --directory compat pytest --collect-only -q > "$RUNNER_TEMP/compat-tests.txt"
          python3 -I scripts/check-security-tests-map.py --pytest "$RUNNER_TEMP/compat-tests.txt"
      # Needs no network: checks the harness isolates client env and caches.
      - name: Harness isolation
        run: uv run --frozen --directory compat pytest tests/test_harness.py -m "not pinned"
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m agent
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # Stock hf_xet (the pinned floor) against openxet serve, with no Hub.
  compat-storage-only:
    name: compat (storage-only)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
          cache-dependency-glob: compat/uv.lock
      - run: cargo build --locked -p openxet
      - run: uv run --frozen --directory compat pytest -m storage_only
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet
      # docs/quickstart-storage-only.md runs as written, install block
      # excepted, and steps 2 to 5 fail past 2 minutes. The end-to-end time
      # to first upload (design §5.8) is measured per release.
      - run: uv run --frozen --directory compat pytest -m docs
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet

  # Not a required check: it needs the nightly toolchain, whose moving
  # sanitizer and coverage flags make it non-hermetic (see GOVERNANCE.md).
  fuzz-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The fuzzed crates, their dependency versions (fuzz/seed.sh derives
      # the fuzz lockfile from Cargo.lock), or the targets themselves.
      - name: Parser or fuzz targets changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(crates/(protocol|auth|cas|index|storage)/|fuzz/|Cargo\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to a fuzzed crate (protocol, auth, cas, index, storage), fuzz/ or Cargo.lock; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install nightly --profile minimal
      - if: steps.changed.outputs.run == 'true'
        run: scripts/fetch-reference-files.sh
      # Also rewrites fuzz/Cargo.lock from Cargo.lock, so it runs before the
      # cache keys on that lockfile. The committed one must match: cargo-fuzz
      # has no --locked, so this is what keeps the fuzz build locked.
      - if: steps.changed.outputs.run == 'true'
        run: fuzz/seed.sh
      - if: steps.changed.outputs.run == 'true'
        name: fuzz/Cargo.lock matches Cargo.lock
        run: |
          git diff --exit-code fuzz/Cargo.lock || {
            echo "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock is out of step with Cargo.lock; run fuzz/seed.sh and commit fuzz/Cargo.lock"
            exit 1
          }
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2
      # fuzz/ is its own workspace, so the deny job doesn't see what only
      # fuzzing adds.
      - if: steps.changed.outputs.run == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which can't link the sanitizer runtime.
      - if: steps.changed.outputs.run == 'true'
        run: |
          for target in xorb_upload xorb_chunks upload_shard verify_shard \
            cas_token transfer_url reconstruction_range; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  # Builds the docs site as pages.yml deploys it, which fails on an mdBook
  # warning, a page under docs/ missing from docs/SUMMARY.md, or a repository
  # link to a missing file; then checks every link and anchor in the built
  # site and in docs/, offline. Not a required check yet.
  docs-site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: mdbook@0.5.4
      - run: scripts/build-site.sh
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --index-files index.html,. --no-progress
            --root-dir ${{ github.workspace }}/target/site/public
            --exclude-path docs/SUMMARY.md
            target/site/public docs
          jobSummary: false
