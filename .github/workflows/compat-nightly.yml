name: compat-nightly

# Real HF clients against huggingface.co, anonymously. The "latest" leg runs
# the newest HF client releases (httpx and pytest stay pinned) to catch
# upstream drift before it reaches users (design section 8). The storage-only
# legs run the newest hf-xet release and pre-release against openxet serve,
# through the storage-only tests and the quickstart. The agent, docs and
# pinned storage-only legs run on every PR, so they are excluded here.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: https://huggingface.co

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      # An upstream outage is not a compatibility failure: skip the suite and
      # open no issue.
      - id: probe
        run: |
          if curl -fsS --retry 3 --retry-all-errors --max-time 20 -o /dev/null "$TARGET/api/models?limit=1"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TARGET is unreachable; skipping the compatibility suite"
          fi

  compat:
    name: compat (${{ matrix.clients }})
    needs: preflight
    if: needs.preflight.outputs.reachable == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clients: [pinned, latest]
    defaults:
      run:
        shell: bash
        working-directory: compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
      - name: Run suite with the locked client versions
        if: matrix.clients == 'pinned'
        run: uv run --frozen pytest -m "not agent and not storage_only and not docs and not hub and not git and not lfs" | tee report.txt
      # The token-signing libraries keep the locked versions: they are test
      # tooling (the dev group), not HF clients, and the suite imports them at
      # collection.
      - name: Run suite with the latest HF client releases
        if: matrix.clients == 'latest'
        run: >
          uv run --no-project --with huggingface_hub --with hf_xet
          --with httpx==0.28.1 --with pytest==9.1.1
          --with pyjwt==2.15.1 --with cryptography==50.0.2
          pytest -m "not agent and not storage_only and not docs and not hub and not git and not lfs and not pinned" | tee report.txt
      - name: Keep the version header
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.clients }}
          path: compat/report.txt
          if-no-files-found: ignore

  # Needs no Hub, so it runs whether or not huggingface.co is reachable.
  # The pre-release leg runs what hf_xet ships next, such as a pre-release
  # that probes the upload-grant route and falls back on its 404 (ruling
  # M1-R9). The resolved version is printed in the report header.
  storage-only:
    name: compat (storage-only, ${{ matrix.hf_xet }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hf_xet: [release, prerelease]
    defaults:
      run:
        shell: bash
        working-directory: compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.8"
      - run: cargo build --locked -p openxet
      # A separate environment: the locked one keeps the floor, 1.7.0. The
      # token-signing libraries keep the locked versions.
      - name: Install the newest hf-xet ${{ matrix.hf_xet }}
        env:
          PRERELEASE: ${{ matrix.hf_xet == 'prerelease' && 'allow' || 'disallow' }}
        run: |
          uv venv "$RUNNER_TEMP/clients"
          uv pip install --python "$RUNNER_TEMP/clients" --prerelease "$PRERELEASE" \
            hf-xet huggingface_hub httpx==0.28.1 pytest==9.1.1 pyjwt==2.15.1 cryptography==50.0.2
          uv pip list --python "$RUNNER_TEMP/clients" | grep -i '^hf-xet '
      # The quickstarts tell readers to install `hf_xet>=1.7.0` and
      # `huggingface_hub>=2.2.0`, so they run with the newest releases too.
      - name: Run the storage-only leg and the quickstarts
        env:
          OPENXET_BIN: ${{ github.workspace }}/target/debug/openxet
        run: >
          "$RUNNER_TEMP/clients/bin/python" -m pytest tests/test_storage_only.py
          tests/test_docs_quickstart.py -m "(storage_only or docs) and not pinned"
          | tee report.txt
      - name: Keep the version header and measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-storage-only-${{ matrix.hf_xet }}
          path: compat/report.txt
          if-no-files-found: ignore

  report:
    needs: [preflight, compat, storage-only]
    # A skipped compat job (huggingface.co unreachable) is not a failure.
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the failure issue
        run: |
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and (.name | startswith("compat ("))) | .name] | join(", ")')
          # Latest-only failure means upstream moved; a pinned failure means we broke.
          if [[ "$failed" == *"compat (pinned)"* ]]; then
            label=compat-failure
            title="Nightly compatibility suite failing"
          else
            label=drift
            title="Upstream HF client drift detected by the nightly suite"
          fi
          body="Failed: ${failed:-unknown job}. Run: ${RUN_URL}"
          gh label create "$label" --force >/dev/null
          existing=$(gh issue list --state open --label "$label" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label "$label" --title "$title" --body "$body"
          fi
