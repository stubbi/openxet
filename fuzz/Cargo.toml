[package]
name = "openxet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

# Its own workspace: libfuzzer-sys needs nightly and sanitizer flags that must
# not leak into the main build (the root workspace excludes `fuzz`).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
# fuzz/Cargo.lock is derived from the workspace's Cargo.lock (fuzz/seed.sh),
# which doesn't hold the crates only fuzzing needs; pinned exactly here, they
# resolve the same on every run. Bump both together.
arbitrary = "=1.5.0"
base64 = "0.22.1"
http = "1.5.0"
libfuzzer-sys = "=0.4.13"
openxet-auth = { path = "../crates/auth", version = "0.0.0" }
openxet-cas = { path = "../crates/cas", version = "0.0.0", features = ["fuzzing"] }
openxet-protocol = { path = "../crates/protocol", version = "0.0.0" }
openxet-uri = { path = "../crates/uri", version = "0.0.0" }
url = "2.5.8"

[[bin]]
name = "xorb_upload"
path = "fuzz_targets/xorb_upload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xorb_chunks"
path = "fuzz_targets/xorb_chunks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_shard"
path = "fuzz_targets/upload_shard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_shard"
path = "fuzz_targets/verify_shard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cas_token"
path = "fuzz_targets/cas_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transfer_url"
path = "fuzz_targets/transfer_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reconstruction_range"
path = "fuzz_targets/reconstruction_range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xet_uri"
path = "fuzz_targets/xet_uri.rs"
test = false
doc = false
bench = false
