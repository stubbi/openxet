[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# The fuzz workspace (fuzz/Cargo.lock) is checked in the fuzz-smoke job.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    # The CAS server uses tower-http 0.7; 0.6 is pulled by reqwest via
    # xet-runtime on the client side (openxet-protocol's xet-core-structures).
    { crate = "tower-http@0.6", reason = "pulled by reqwest via xet-runtime on the client side" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
