[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin (RSA private-key timing). `rsa` comes only from jsonwebtoken's
    # `rust_crypto` backend, which compiles every algorithm in. openxet-auth
    # verifies EdDSA only and never constructs an RSA key, so the affected
    # private-key operations are unreachable. Revisit when jsonwebtoken or
    # rsa ships a fix.
    { id = "RUSTSEC-2023-0071", reason = "rsa is linked by jsonwebtoken but no RSA key is ever used" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# The fuzz workspace (fuzz/Cargo.lock) is checked in the fuzz-smoke job.
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
