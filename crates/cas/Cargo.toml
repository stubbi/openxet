[package]
name = "openxet-cas"
version = "0.0.0"
description = "openxet's Xet CAS HTTP API: routes, errors, request ids and authentication"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: `endpoints()` and `Endpoint`, the routes the router serves, so
# the tests can check every route is in their credential and echo matrices.
# Never enable it in a shipped build.
test-support = []
# Fuzz-only: `reconstruction_range()`, the `Range` parser of the
# reconstruction routes, for the target in `fuzz/`. Never enable it in a
# shipped build.
fuzzing = []

[dependencies]
axum = "0.8.9"
futures-core = "0.3.34"
getrandom = "0.4.3"
http-body = "1.1.0"
http-body-util = { version = "0.1.5", features = ["channel"] }
foldhash = "0.2.0"
itoa = "1.0.18"
openxet-auth = { path = "../auth", version = "0.0.0" }
openxet-index = { path = "../index", version = "0.0.0" }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
openxet-storage = { path = "../storage", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "sensitive-headers", "trace"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
async-trait = "0.1.92"
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
openxet-index = { path = "../index", version = "0.0.0", features = ["test-support"] }
openxet-cas = { path = ".", features = ["test-support"] }
openxet-protocol = { path = "../protocol", version = "0.0.0", features = ["test-support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["migrate"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1.29.0", features = ["v4"] }

[lints]
workspace = true

[[bench]]
name = "reconstruction"
harness = false

[[bench]]
name = "xorb_ingest"
harness = false

[[bench]]
name = "commit_throughput"
harness = false
