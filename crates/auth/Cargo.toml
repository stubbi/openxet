[package]
name = "openxet-auth"
version = "0.0.0"
description = "openxet's authentication and authorization: static tokens, EdDSA CAS tokens, signed URLs and capabilities, and the rules authorizer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
# Only for its `zeroize` feature, which ed25519-dalek doesn't enable: it
# wipes `KeypairBytes` on drop and the PKCS#8 encoder's copy of the seed.
ed25519 = { version = "3.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
itoa = "1.0.18"
openxet-protocol = { path = "../protocol", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
curve25519-dalek = "5.0.0"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
