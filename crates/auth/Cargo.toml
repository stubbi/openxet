[package]
name = "openxet-auth"
version = "0.0.0"
description = "openxet's authentication: static tokens, EdDSA CAS tokens and range-bound signed URLs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
# Only for its `zeroize` feature, which ed25519-dalek doesn't enable: it
# wipes `KeypairBytes` on drop and the PKCS#8 encoder's copy of the seed.
ed25519 = { version = "3.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
curve25519-dalek = "5.0.0"
serde_urlencoded = "0.7.1"

[lints]
workspace = true
