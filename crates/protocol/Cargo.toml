[package]
name = "openxet-protocol"
version = "0.0.0"
description = "Xet protocol formats and hashing for openxet, backed by Hugging Face's xet-core crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: `read_dedup_answer` and `decode_fetched_chunks`, which read a
# dedup answer and a fetched xorb range as a stock client does, for the CAS's
# tests. Never enable it in a shipped build.
test-support = []

[dependencies]
thiserror = "2"
xet-core-structures = "=1.7.0"

[dev-dependencies]
bytes = "1"
openxet-protocol = { path = ".", features = ["test-support"] }

[lints]
workspace = true
