[package]
name = "openxet-hub"
version = "0.0.0"
description = "openxet's Hub API: repositories, typed views, labels and whoami for huggingface_hub and the hf CLI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: `endpoints()`, the routes the Hub serves, and `test_support`,
# a Hub over a temporary index and bucket with the fixture comparisons the
# tests share, so they can check every route is in their credential and
# echo matrices. Never enable it in a shipped build.
test-support = ["openxet-http/test-support", "dep:tempfile", "dep:tower"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
# `.gitattributes` lines and their patterns, as git reads them, for routing
# a file to Xet by pattern (ruling M2-R4).
gix-attributes = "0.37.1"
http-body-util = "0.1.5"
humantime = "2.4.0"
openxet-auth = { path = "../auth", version = "0.0.0" }
openxet-git = { path = "../git", version = "0.0.0" }
openxet-http = { path = "../http", version = "0.0.0" }
openxet-index = { path = "../index", version = "0.0.0" }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
openxet-storage = { path = "../storage", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2"
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
async-trait = "0.1.92"
openxet-cas = { path = "../cas", version = "0.0.0" }
openxet-hub = { path = ".", features = ["test-support"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
