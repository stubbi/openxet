[package]
name = "openxet-http"
version = "0.0.0"
description = "openxet's HTTP plumbing: the route builder, request ids, the error body and the middleware every route gets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: `endpoints()` and `Endpoint`, the routes a router serves, so
# the tests can check every route is in their credential and echo matrices.
# Never enable it in a shipped build.
test-support = []

[dependencies]
axum = "0.8.9"
http-body = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["time"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "sensitive-headers", "trace"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
http-body-util = { version = "0.1.5", features = ["channel"] }
openxet-http = { path = ".", features = ["test-support"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
