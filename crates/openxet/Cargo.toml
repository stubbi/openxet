[package]
name = "openxet"
version = "0.0.0"
description = "Open-source server and client for the Xet protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["server-graceful", "tokio"] }
openxet-auth = { path = "../auth", version = "0.0.0" }
openxet-cas = { path = "../cas", version = "0.0.0" }
openxet-client = { path = "../client", version = "0.0.0" }
openxet-git = { path = "../git", version = "0.0.0" }
openxet-http = { path = "../http", version = "0.0.0" }
openxet-hub = { path = "../hub", version = "0.0.0" }
openxet-index = { path = "../index", version = "0.0.0" }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
openxet-storage = { path = "../storage", version = "0.0.0" }
openxet-workspace = { path = "../workspace", version = "0.0.0" }
# `openxet label`'s requests, with the TLS the client core uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Not used directly: reqwest takes rustls without its default features, which
# leaves `prefer-post-quantum` off and offers X25519MLKEM768 last. Cargo
# unifies features, so this turns it on for every rustls client in the
# binary: the client core's and `openxet label`'s (ADR 0011 item 1, #66).
rustls = { version = "0.23.46", default-features = false, features = ["prefer-post-quantum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
url = "2.5.8"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
assert_cmd = "2"
bytes = "1.12.1"
futures-util = "0.3.34"
# `openapi.rs`: OpenAPI 3.1's own JSON Schema is draft 2020-12; without the
# default features, which fetch remote references over HTTP.
jsonschema = { version = "0.60.1", default-features = false }
# `openapi.rs`: the routes the server serves, to compare with the document.
openxet-cas = { path = "../cas", version = "0.0.0", features = ["test-support"] }
openxet-hub = { path = "../hub", version = "0.0.0", features = ["test-support"] }
predicates = "3"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
sha2 = "0.11.1"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
# `openapi.rs`: the document parses as utoipa's own model.
utoipa = "6.0.0"

[lints]
workspace = true
