[package]
name = "openxet"
version = "0.0.0"
description = "Open-source server and client for the Xet protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
openxet-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
