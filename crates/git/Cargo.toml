[package]
name = "openxet-git"
version = "0.0.0"
description = "openxet's Git engine: the node pack cache, per-request snapshot repositories and the sanitised git process"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openxet-index = { path = "../index", version = "0.0.0" }
openxet-storage = { path = "../storage", version = "0.0.0" }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.54.1", features = ["process", "rt", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
