[package]
name = "openxet-storage"
version = "0.0.0"
description = "openxet's bucket: durable, content-addressed object storage"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures-core = "0.3.34"
openxet-protocol = { path = "../protocol", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
