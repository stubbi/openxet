[package]
name = "openxet-workspace"
version = "0.0.0"
description = "OpenXet agent workspaces: the per-user registry of Git worktrees and which of their paths are reconstructible"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
libc = "0.2.191"
reflink-copy = "0.1.30"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
