[package]
name = "openxet-index"
version = "0.0.0"
description = "openxet's rebuildable index of xorbs, files, scopes and dedup entries"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: a scope name that makes register_shard fail midway, so the
# atomicity test can observe a rolled-back transaction. Never enable it in a
# shipped build.
fault-injection = []
# Test-only: `rebuild_scope_tables`, which rebuilds the scope tables from a
# bucket, and `SqliteIndex::scope_tables`, which reads them, so tests can
# prove the bucket is the source of truth (ruling M1-R37). The core of
# `reindex` (issue #26). Never enable it in a shipped build.
test-support = ["dep:openxet-storage", "dep:bytes"]

[dependencies]
async-trait = "0.1"
bytes = { version = "1.12.1", optional = true }
openxet-protocol = { path = "../protocol", version = "0.0.0" }
openxet-storage = { path = "../storage", version = "0.0.0", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
openxet-index = { path = ".", features = ["fault-injection"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
